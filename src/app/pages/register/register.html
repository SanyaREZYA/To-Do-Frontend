<div class="container min-vh-100 d-flex justify-content-center align-items-center">
  <div class="card shadow" style="width: 400px">
    <div class="card-body"><h1 class="text-primary text-center mb-4">Реєстрація</h1>
      <form [formGroup]="registerForm" (ngSubmit)="register()">
        <div class="form-floating mb-3">
          <input type="text" class="form-control" id="name" placeholder="Нап. Олег Шевченко" formControlName="name"
                 [class.is-invalid]="registerForm.get('name')?.invalid && registerForm.get('name')?.touched" />
          <label for="name">Ім'я </label></div>
        <div class="form-floating mb-3">
          <input type="email" class="form-control" id="email" placeholder="name@example.com" formControlName="email"
                 [class.is-invalid]="registerForm.get('email')?.invalid && registerForm.get('email')?.touched" />
          <label for="email">Email </label></div>
        <div class="form-floating mb-3">
          <input type="password" class="form-control" id="password" placeholder="Ваш пароль" formControlName="password"
                 [class.is-invalid]="registerForm.get('password')?.invalid && registerForm.get('password')?.touched" />
          <label for="password">Пароль</label>
        </div>
        <a class="text-primary" routerLink="/login"> Вже маєте акаунт?</a>
        <button type="submit" class="btn btn-success w-100 mt-3">Зареєструватись</button>
      </form>
    </div>
  </div>
</div>
