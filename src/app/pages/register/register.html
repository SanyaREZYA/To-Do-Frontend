<div class="container min-vh-100 d-flex justify-content-center align-items-center">
  <div class="card shadow mx-auto" style="min-width: 400px">
    <div class="card-body"><h1 class="text-primary text-center mb-4">Реєстрація</h1>
      <div class="form-floating mb-3">
        <input type="text" class="form-control" id="name" placeholder="Нап. Олег Шевченко" />
        <label for="name">Ім'я </label></div>
      <div class="form-floating mb-3">
        <input type="email" class="form-control" id="email" placeholder="name@example.com" />
        <label for="email">Email </label></div>
      <div class="form-floating mb-3">
        <input type="password" class="form-control" id="password" placeholder="Ваш пароль" />
        <label for="password">Пароль</label>
      </div>
      <a class="text-primary" routerLink="/login"> Вже маєте аккаунт?</a>
      <button class="btn btn-success w-100 mt-3">Зареєструватись</button>
    </div>
  </div>
</div>
