<div class="modal fade show" tabindex="-1" style="display: block;">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Редагувати задачу</h5>
        <button type="button" class="btn-close" (click)="onClose()"></button>
      </div>
      <form [formGroup]="taskUpdateForm" (ngSubmit)="updateTask()">
        <div class="modal-body">
          <div class="mb-4"><h5 class="mb-1">Редагування задачі</h5>
            <p class="text-secondary mb-0"> Змініть потрібні дані та збережіть зміни. </p></div>

          <div class="form-floating mb-3">
            <input type="text" class="form-control" id="taskTitle" placeholder="Назва задачі" formControlName="title" />
            <label for="taskTitle">Назва задачі</label>
          </div>

          <div class="form-floating mb-3">
  <textarea class="form-control task-description" id="taskDescription" placeholder="Опис задачі"
            formControlName="description"></textarea>
            <label for="taskDescription">Опис задачі</label>
          </div>

          <div class="form-floating">
            <input type="date" class="form-control" id="taskDueDate" formControlName="dueDate" />
            <label for="taskDueDate">Термін виконання</label>
          </div>

        </div>

        <div class="modal-footer border-0 pt-0">
          <button type="button" class="btn btn-outline-secondary" (click)="onClose()"> Скасувати</button>

          <button type="submit" class="btn btn-primary" [disabled]="taskUpdateForm.invalid">
            <i class="bi bi-check-lg me-1"></i>
            Зберегти зміни
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
<div class="modal-backdrop fade show"></div>
